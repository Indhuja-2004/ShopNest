<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Create your ShopNest account">

    <title>Sign Up - ShopNest</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <nav>

            <a href="index.html" class="logo">
                ShopNest
            </a>

            <ul class="nav-links">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="products.html">
                        Shop
                    </a>
                </li>

                <li>
                    <a href="products.html">
                        Categories
                    </a>
                </li>

                <li>
                    <a href="products.html">
                        Deals
                    </a>
                </li>

                <li>
                    <a href="contact.html">
                        Contact
                    </a>
                </li>

            </ul>

            <div class="nav-actions">

                <a href="login.html">
                    Login
                </a>

                <a href="signup.html"
                    class="signup-btn">
                    Sign Up
                </a>

                <a href="cart.html">
                    🛒
                </a>

            </div>

        </nav>

    </header>


    <!-- Sign Up Section -->
    <main>

        <section class="signup-section">

            <div class="signup-container">

                <div class="signup-heading">

                    <p>
                        JOIN SHOPNEST
                    </p>

                    <h1>
                        Create Your Account
                    </h1>

                    <span>
                        Sign up to start your shopping journey.
                    </span>

                </div>


                <!-- Sign Up Form -->

                <form class="signup-form">


                    <!-- Full Name -->

                    <div class="form-group">

                        <label for="fullname">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            placeholder="Enter your full name"
                            required>

                    </div>


                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <!-- Phone -->

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            pattern="[0-9]{10}"
                            maxlength="10"
                            required>

                    </div>


                    <!-- Date of Birth -->

                    <div class="form-group">

                        <label for="dob">
                            Date of Birth
                        </label>

                        <input
                            type="date"
                            id="dob"
                            name="dob"
                            required>

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            minlength="6"
                            required>

                    </div>


                    <!-- Confirm Password -->

                    <div class="form-group">

                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Confirm your password"
                            minlength="6"
                            required>

                    </div>


                    <!-- Gender -->

                    <fieldset class="gender-group">

                        <legend>
                            Gender
                        </legend>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="male">

                            Male
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="female">

                            Female
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="other">

                            Other
                        </label>

                    </fieldset>


                    <!-- Terms -->

                    <div class="terms-group">

                        <label>

                            <input
                                type="checkbox"
                                required>

                            I agree to the
                            <a href="#">
                                Terms & Conditions
                            </a>

                        </label>

                    </div>


                    <!-- Submit -->

                    <button
                        type="submit"
                        class="signup-submit">

                        Create Account

                    </button>


                    <!-- Login Link -->

                    <p class="login-link">

                        Already have an account?

                        <a href="login.html">
                            Login
                        </a>

                    </p>

                </form>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            &copy; 2026 ShopNest.
            All Rights Reserved.
        </p>

    </footer>

</body>

</html>
