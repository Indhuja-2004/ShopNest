<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ShopNest - Product details">
    <!-- Title will be updated dynamically -->
    <title id="page-title">Product Details - ShopNest</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header>
        <nav>
            <a href="index.html" class="logo">ShopNest</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Shop</a></li>
                <li><a href="calculator.html">Calculator</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="nav-actions">
                <a href="login.html">Login</a>
                <a href="signup.html" class="signup-btn">Sign Up</a>
                <a href="cart.html">🛒</a>
            </div>
        </nav>
    </header>

    <!-- =========================
         PRODUCT DETAILS
    ========================== -->
    <main>
        <section class="product-details-section" id="product-detail-container">
            <!-- Details will be injected here by JS -->
            <p style="text-align:center; padding: 50px;">Loading product...</p>
        </section>

        <!-- =========================
             RELATED PRODUCTS
        ========================== -->
        <section class="products-section" style="margin-top: 50px;">
            <div class="section-heading">
                <p>SIMILAR ITEMS</p>
                <h2>Related Products</h2>
            </div>
            
            <!-- Grid for related products -->
            <div class="product-grid" id="related-products-grid">
                <!-- Related products will be injected here by JS -->
            </div>
        </section>
    </main>

    <!-- =========================
         FOOTER
    ========================== -->
    <footer>
        <p>&copy; 2026 ShopNest. All Rights Reserved.</p>
    </footer>

    <!-- Load Product Details JavaScript Module -->
    <script type="module" src="js/product-details.js"></script>
