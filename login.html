<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Login to your ShopNest account">

    <title>Login - ShopNest</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <nav>

            <a href="index.html" class="logo">
                ShopNest
            </a>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="products.html">Shop</a>
                </li>

                <li>
                    <a href="products.html">Categories</a>
                </li>

                <li>
                    <a href="products.html">Deals</a>
                </li>

                <li>
                    <a href="contact.html">Contact</a>
                </li>

            </ul>

            <div class="nav-actions">

                <a href="login.html">
                    Login
                </a>

                <a href="signup.html" class="signup-btn">
                    Sign Up
                </a>

                <a href="cart.html">
                    🛒
                </a>

            </div>

        </nav>

    </header>


    <!-- Login Section -->
    <main>

        <section class="login-section">

            <div class="login-container">

                <div class="login-heading">

                    <p>
                        WELCOME BACK
                    </p>

                    <h1>
                        Login to ShopNest
                    </h1>

                    <span>
                        Sign in to continue shopping.
                    </span>

                </div>


                <!-- Login Form -->

                <form class="login-form">


                    <!-- Email -->

                    <div class="form-group">

                        <label for="login-email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="login-email"
                            name="email"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label for="login-password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="login-password"
                            name="password"
                            placeholder="Enter your password"
                            minlength="6"
                            required>

                    </div>


                    <!-- Remember & Forgot -->

                    <div class="login-options">

                        <label>

                            <input
                                type="checkbox"
                                name="remember">

                            Remember me

                        </label>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>


                    <!-- Login Button -->

                    <button
                        type="submit"
                        class="login-submit">

                        Login

                    </button>


                    <!-- Sign Up Link -->

                    <p class="signup-link">

                        Don't have an account?

                        <a href="signup.html">
                            Create Account
                        </a>

                    </p>

                </form>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            &copy; 2026 ShopNest.
            All Rights Reserved.
        </p>

    </footer>

</body>

</html>
